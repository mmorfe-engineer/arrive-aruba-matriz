<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arrive Aruba</title>
<meta name="description" content="Arrive Aruba — resortwear shaped by the island. Take home what you felt." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Geologica',system-ui,sans-serif;background:#386395;color:#F0F0E5;min-height:100svh;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;background-image:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(95,139,184,0.55) 0%,transparent 60%);-webkit-font-smoothing:antialiased;}
  img.logo{width:230px;max-width:72vw;height:auto;margin-bottom:22px;animation:rise 1s ease both;}
  p.tag{font-family:Georgia,serif;font-style:italic;font-size:17px;color:rgba(240,240,229,0.78);margin-bottom:54px;animation:rise 1s .25s both;}
  .links{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px;animation:rise 1s .5s both;}
  a.btn{display:block;padding:17px 24px;border-radius:9999px;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;text-decoration:none;transition:opacity .2s ease;}
  a.primary{background:#F0F0E5;color:#23405e;}
  a.ghost{border:1px solid rgba(240,240,229,0.4);color:#F0F0E5;}
  a.btn:hover{opacity:.82;}
  .foot{margin-top:48px;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,240,229,0.4);}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
  <img class="logo" src="assets/logo-white.png" alt="Arrive Aruba" />
  <p class="tag">Take home what you felt. ✦</p>
  <nav class="links">
    <a class="btn primary" href="Arrive%20Aruba%20-%20Homepage.dc.html">Enter the website</a>
    <a class="btn ghost" href="Arrive%20Aruba%20-%20App.dc.html">Open the mobile app</a>
  </nav>
  <p class="foot">Resortwear shaped by the island</p>
</body>
</html>
