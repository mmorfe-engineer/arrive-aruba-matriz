name: Deploy Shopify Theme

on:
  push:
    branches: [ main ]
    paths:
      - 'shopify/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Shopify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Deploy theme to Shopify
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_ACCESS_TOKEN }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
        run: |
          echo "🚀 Starting Shopify theme deployment..."
          echo "Store: $SHOPIFY_SHOP"
          
          # Verificar que tenemos los secrets configurados
          if [ -z "$SHOPIFY_SHOP" ] || [ -z "$SHOPIFY_ADMIN_API_ACCESS_TOKEN" ]; then
            echo "::error::Missing Shopify credentials in GitHub Secrets"
            echo "Please add the following secrets to your GitHub repository:"
            echo "  - SHOPIFY_SHOP: Your store URL (e.g., tu-tienda.myshopify.com)"
            echo "  - SHOPIFY_ADMIN_API_ACCESS_TOKEN: Admin API access token with write_themes permission"
            echo "  - SHOPIFY_THEME_ID: Your theme ID (find it in Shopify Admin → Online Store → Themes)"
            exit 1
          fi
          
          # Ejecutar el script de despliegue
          cd scripts
          node deploy-shopify.js
