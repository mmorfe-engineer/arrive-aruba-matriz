name: Shopify Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/shopify-theme-v1]

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest
      - name: Validate theme
        run: shopify theme check --path .
