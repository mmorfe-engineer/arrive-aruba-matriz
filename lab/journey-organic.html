<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5f8bb8">
  <title>Journey Organic | Arrive Aruba</title>
  <meta name="description" content="Open the window and arrive in Aruba.">
  <link rel="icon" href="../preview-assets/brand/logo-mark.svg">
  <link rel="stylesheet" href="../journey-organic.css?v=3-final">
  <script src="../journey-organic.js?v=3-final" defer></script>
</head>
<body class="aa-organic-page">
  <main>
    <section
      class="aa-organic-journey"
      data-journey-organic
      data-manifest="../preview-assets/journey-organic/manifest.json"
      data-fallback-poster="../preview-assets/journey-organic/mobile/poster.webp"
      data-scroll-length="240"
      aria-label="Arrive Aruba window journey"
    >
      <div class="aa-organic-journey__sticky">
        <div class="aa-organic-sky" aria-hidden="true">
          <div class="aa-organic-sky__wash"></div>
          <div class="aa-organic-cloud aa-organic-cloud--far"></div>
          <div class="aa-organic-cloud aa-organic-cloud--middle"></div>
          <div class="aa-organic-cloud aa-organic-cloud--near"></div>
          <div class="aa-organic-sky__haze"></div>
        </div>

        <header class="aa-organic-header">
          <a class="aa-organic-header__brand" href="../Arrive Aruba - Homepage.dc.html" aria-label="Arrive Aruba home">
            <img src="../preview-assets/brand/logo-negative.webp" alt="Arrive Aruba" width="128" height="66">
          </a>
          <a class="aa-organic-header__home" href="../Arrive Aruba - Homepage.dc.html">Arrive home</a>
        </header>

        <div class="aa-organic-visual" data-journey-visual aria-hidden="true">
          <img class="aa-organic-visual__poster" data-journey-poster alt="" decoding="async">
          <canvas class="aa-organic-visual__canvas" data-journey-canvas></canvas>
          <img class="aa-organic-visual__final" data-journey-final alt="" decoding="async">
        </div>

        <p class="aa-organic-copy" data-journey-copy>Nine degrees north.</p>

        <a class="aa-organic-skip" href="#shop-example">Skip to shop</a>
        <p class="aa-organic-status" data-journey-status role="status" aria-live="polite">Preparing the view</p>
      </div>
    </section>

    <section class="aa-organic-shop" id="shop-example" aria-labelledby="shop-example-title">
      <p class="aa-organic-shop__eyebrow">Arrive Aruba</p>
      <h1 id="shop-example-title">Take the island with you.</h1>
      <p>This is a simple Shopify handoff example. Product sections remain editable in the theme.</p>
      <a href="../Arrive Aruba - Collection.dc.html">Visit the collection</a>
    </section>
  </main>
</body>
</html>
